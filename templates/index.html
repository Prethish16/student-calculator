<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background-color: #e2e3e5; border-radius: 4px; }
        .error { color: red; text-align: center; font-weight: bold; }
        .metrics { font-weight: bold; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <h2>Student Calculator</h2>
    <form method="post">
        <div class="form-group">
            <label>Subject 1 Marks:</label>
            <input type="text" name="marks1" value="{{ marks1 }}">
        </div>
        <div class="form-group">
            <label>Subject 2 Marks:</label>
            <input type="text" name="marks2" value="{{ marks2 }}">
        </div>
        <div class="form-group">
            <label>Subject 3 Marks:</label>
            <input type="text" name="marks3" value="{{ marks3 }}">
        </div>
        <button type="submit">Calculate</button>
    </form>
    {% if result %}
        <div class="result">
            {% if result.error %}
                <p class="error">{{ result.error }}</p>
            {% else %}
                <p class="metrics">Total Marks: {{ result.total }}</p>
                <p class="metrics">Average Marks: {{ result.average }}</p>
                {% if result.grade %}
                    <p class="metrics">Grade: {{ result.grade }}</p>
                {% endif %}
            {% endif %}
        </div>
    {% endif %}
</div>
</body>
</html>
